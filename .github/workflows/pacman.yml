name: Generate arcade contribution graph

on:
  schedule:
    - cron: "0 4 * * *" # roda todo dia às 04:00 UTC (01:00 no horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar SVGs do jogo
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "bomberman"

      - name: Publicar na branch pacman-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
