{name: "Update stats cards", on: {schedule: [{cron: "0 5 * * *"}], workflow_dispatch: {}, push: {branches: ["main"]}}, permissions: {contents: "write"}, jobs: {build: {runs-on: "ubuntu-latest", steps: [{uses: "actions/checkout@v4"}, {name: "Gerar card de stats", uses: "stats-organization/github-readme-stats-action@v2", with: {card: "stats", options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=dark&hide_border=true&locale=pt-br", path: "profile/stats.svg", token: "${{ secrets.GITHUB_TOKEN }}"}}, {name: "Gerar card de linguagens", uses: "stats-organization/github-readme-stats-action@v2", with: {card: "top-langs", options: "username=${{ github.repository_owner }}&layout=compact&card_width=320&langs_count=5&theme=dark&hide_border=true&locale=pt-br&hide_title=true", path: "profile/top-langs.svg", token: "${{ secrets.GITHUB_TOKEN }}"}}, {name: "Commitar cards", run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add profile/*.svg\ngit commit -m \"Update stats cards\" || exit 0\ngit push"}]}}}
