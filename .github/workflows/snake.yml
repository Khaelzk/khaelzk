name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *" # roda todo dia às 03:00 UTC (00:00 no horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar snake.svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?color_snake=#f1fa8c&color_dots=#282a36,#44475a,#6272a4,#bd93f9,#ff79c6

      - name: Publicar na branch snake-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
